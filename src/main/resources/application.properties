spring.application.name=zest-assignment

server.port=8080

# =========================================================
# Database
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ZestAssignment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=false

spring.jpa.open-in-view=false


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${APP_JWT_SECRET}

app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}


# =========================================================
# Refresh Token
# =========================================================

app.refresh-token.expiration-days=${APP_REFRESH_TOKEN_EXPIRATION_DAYS:7}


# =========================================================
# CORS
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


# =========================================================
# Admin
# =========================================================

app.admin.username=${ADMIN_USERNAME:admin}

app.admin.password=${ADMIN_PASSWORD:Admin@12345}


# =========================================================
# Forwarded Headers
# =========================================================

server.forward-headers-strategy=framework