services:

  mysql:
    image: mysql:8.4
    container_name: zest-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ZestAssignment
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: zestuser
      MYSQL_PASSWORD: zestpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: zest-app

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:

      # ---------------------------------------------------
      # Database
      # ---------------------------------------------------

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ZestAssignment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      SPRING_DATASOURCE_USERNAME: zestuser

      SPRING_DATASOURCE_PASSWORD: zestpassword


      # ---------------------------------------------------
      # JPA / Hibernate
      # ---------------------------------------------------

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_JPA_OPEN_IN_VIEW: "false"


      # ---------------------------------------------------
      # JWT
      # ---------------------------------------------------

      APP_JWT_SECRET: ${APP_JWT_SECRET}

      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-900000}


      # ---------------------------------------------------
      # Refresh Token
      # ---------------------------------------------------

      APP_REFRESH_TOKEN_EXPIRATION_DAYS: ${APP_REFRESH_TOKEN_EXPIRATION_DAYS:-7}


      # ---------------------------------------------------
      # CORS
      # ---------------------------------------------------

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}


      # ---------------------------------------------------
      # Admin Seeder
      # ---------------------------------------------------

      ADMIN_USERNAME: ${ADMIN_USERNAME}

      ADMIN_PASSWORD: ${ADMIN_PASSWORD}


      # ---------------------------------------------------
      # Spring
      # ---------------------------------------------------

      SERVER_FORWARD_HEADERS_STRATEGY: framework

volumes:

  mysql_data: